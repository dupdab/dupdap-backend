apiVersion: v1
kind: ConfigMap
metadata:
  name: dupdap-backend-config
data:
  PORT: '3000'
  NODE_ENV: production
  API_PREFIX: api/v1
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: dupdub
  DB_POOL_MIN: '2'
  DB_POOL_MAX: '20'
  DB_SLOW_QUERY_THRESHOLD_MS: '500'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  STELLAR_NETWORK: TESTNET
  STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
