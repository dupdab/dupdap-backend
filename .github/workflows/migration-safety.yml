name: Migration Safety

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  migration-uncommitted-check:
    name: Migration Uncommitted Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted migrations
        run: npm run migration:uncommitted:check
