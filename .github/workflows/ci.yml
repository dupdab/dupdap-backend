name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint, test, and migration safety checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint (zero warnings)
        run: pnpm lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:cov:ci

      - name: Integration tests
        run: pnpm test:integration

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Type check
        if: always()
        run: pnpm exec tsc --noEmit

      - name: Migration safety check
        run: pnpm migration:check

      - name: Migration rollback check
        run: pnpm migration:rollback:check

      - name: Uncommitted migration check
        run: pnpm migration:uncommitted:check

      - name: Export OpenAPI spec
        run: pnpm export:openapi

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  integration:
    name: Payment lifecycle integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: dupdap_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

  merchant-e2e:
    name: Merchant onboarding and settlement E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:integration@localhost:5432/dupdap_integration

      - name: Start E2E infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Merchant lifecycle E2E
        run: pnpm test:e2e:ci

      - name: Stop E2E infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release-openapi:
    name: Publish OpenAPI spec to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI spec
        run: pnpm export:openapi

      - name: Upload OpenAPI spec to release
        uses: softprops/action-gh-release@v2
        with:
          files: openapi.json

  stellar-testnet:
    name: Stellar testnet integration tests
    runs-on: ubuntu-latest
    # Only runs when testnet secrets are configured; unit test runs skip test/stellar.
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'integration:stellar')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stellar testnet integration tests
        run: pnpm test:integration:stellar
        env:
          STELLAR_TESTNET_ENABLED: 'true'
          STELLAR_TESTNET_SECRET: ${{ secrets.STELLAR_TESTNET_SECRET }}
          SOROBAN_TESTNET_CONTRACT_ID: ${{ secrets.SOROBAN_TESTNET_CONTRACT_ID }}
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
