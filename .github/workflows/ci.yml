name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migration-rollback:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rollback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rollback_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run latest migration
        run: npm run migration:run
      - name: Capture schema state (before rollback)
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" \
            | grep -v '^--' | grep -v '^$' > schema-before.sql
      - name: Rollback latest migration
        run: npm run migration:revert
      - name: Re-run latest migration
        run: npm run migration:run
      - name: Capture schema state (after rollback round-trip)
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" \
            | grep -v '^--' | grep -v '^$' > schema-after.sql
      - name: Assert schema state is identical
        run: |
          if ! diff -u schema-before.sql schema-after.sql; then
            echo "::error::Schema state changed after migration rollback round-trip"
            exit 1
          fi
          echo "Schema state identical before and after rollback round-trip"
