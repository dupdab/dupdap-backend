# Seeded test database for e2e / CI runs.
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: dupdub-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dupdub_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dupdub_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:6-alpine
    container_name: dupdub-redis-test
    ports:
      - '6380:6379'
